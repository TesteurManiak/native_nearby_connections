name: native_nearby_connections
description: "Google Nearby Connections for Flutter (Android and iOS), built on Pigeon."
version: 1.0.0
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=3.3.0"

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  jni: ^1.1.2
  meta: ^1.19.0
  objective_c: ^9.6.4
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.3
  ffigen: ^22.0.0
  swift2objc: ^0.3.1
  swiftgen: ^0.2.0
  path: ^1.9.1
  pub_semver: ^2.2.1
  jnigen: 1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.maniak.native_nearby_connections
        pluginClass: NativeNearbyConnectionsPlugin
      ios:
        pluginClass: NativeNearbyConnectionsPlugin
