name: native_nearby_connections
description: "Google Nearby Connections for Flutter (Android and iOS), built on Pigeon."
version: 1.0.0
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.3

flutter:
  plugin:
    platforms:
      android:
        package: com.maniak.native_nearby_connections
        pluginClass: NativeNearbyConnectionsPlugin
      ios:
        pluginClass: NativeNearbyConnectionsPlugin
